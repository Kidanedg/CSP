name: mobile
description: "CSP - Community Social Platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5

  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1

  shared_preferences: ^2.5.3
  http: ^1.5.0
  dio: ^5.9.0
  email_validator: ^3.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  connectivity_plus: ^7.0.0
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.0
  image_picker: ^1.2.0
  flutter_spinkit: ^5.2.2
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/avatars/
